<text x="189.6" y="799.0" font-size="11" fill="#c2410c" text-anchor="end">Ringgelenk</text>
<text x="820.0" y="736.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="700">Funktion</text>
<text x="820.0" y="755.0" font-size="12" fill="#27313d" text-anchor="start">① Anfahren/Park: Die Abdeckung hängt auf dem Anschlagbund am Rohrende. Der Tastring hängt rechts 50 mm herab</text>
<text x="820.0" y="774.0" font-size="12" fill="#27313d" text-anchor="start">   (Eigengewicht) und hält über die Koppel die Wanne geschlossen unter dem Rohrende.</text>
<text x="820.0" y="793.0" font-size="12" fill="#27313d" text-anchor="start">② Beim Absenken setzt der Ring auf den Domrand (jede Öffnung Ø 450 … 600) und wird flach an die Abdeckung</text>
<text x="820.0" y="812.0" font-size="12" fill="#27313d" text-anchor="start">   gedrückt. Über die Koppel schwenkt die Wanne um 93° nach unten weg. Erst dann trägt der Domrand die</text>
<text x="820.0" y="831.0" font-size="12" fill="#27313d" text-anchor="start">   Abdeckung und das Rohr gleitet durch (Kräfte aus Ring und Feder < Gewicht der Abdeckung).</text>
<text x="820.0" y="850.0" font-size="12" fill="#27313d" text-anchor="start">③ Das Rohr taucht bis 20 cm über den Boden ein und zieht nach. Die Abdeckung bleibt auf dem Dom,</text>
<text x="820.0" y="869.0" font-size="12" fill="#27313d" text-anchor="start">   die Überfüllsicherung steht immer in fester Tiefe unter dem Rand.</text>
<text x="820.0" y="888.0" font-size="12" fill="#27313d" text-anchor="start">④ Herausfahren: Erst wenn der Anschlagbund die Abdeckung mitnimmt (Rohrende wieder auf Höhe ①), hebt sie</text>
<text x="820.0" y="907.0" font-size="12" fill="#27313d" text-anchor="start">   ab, der Ring fällt, die Wanne schwenkt unter das Rohrende. Reihenfolge ohne Sensor.</text>
<text x="820.0" y="926.0" font-size="12" fill="#27313d" text-anchor="start"></text>
<text x="820.0" y="951.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="700">Bewegte Teile: 1 Wanne, 1 Koppel, 1 Tastring – 3 Gelenke, 2 Koppelbolzen, 1 Schenkelfeder</text>
<text x="820.0" y="970.0" font-size="12" fill="#27313d" text-anchor="start">• Ring rechts 50 mm Hub (an der Koppel 36 mm) → Wanne 93°; Hebel 23 mm, Koppel 56,8 mm</text>
<text x="820.0" y="989.0" font-size="12" fill="#27313d" text-anchor="start">• Wannengelenk 110 mm neben der Rohrachse, 90 mm unter der Abdeckung; Wanne 180 × 170 mm, Rand 15 mm</text>
<text x="820.0" y="1008.0" font-size="12" fill="#27313d" text-anchor="start">• wirksamer Hebelarm der Koppel 17 … 22 mm über den ganzen Hub (kein Totpunkt)</text>
<text x="820.0" y="1027.0" font-size="12" fill="#27313d" text-anchor="start">• offene Wanne ca. 0,26 m unter dem Domrand: über dem Spiegel 95 % (0,34 m); Maximalhöhe 0,28 m nur im Fehlerfall</text>
<text x="820.0" y="1046.0" font-size="12" fill="#27313d" text-anchor="start">• Rohrende in Park 65 mm unter der Abdeckung, Wanne 10 mm darunter; Grenzschalter A/B seitlich (y), nicht über der Wanne</text>
<text x="820.0" y="1065.0" font-size="12" fill="#27313d" text-anchor="start">• Ring liegt auf jedem Kragen beidseitig auf → genug Hebel, auch wenn er nahe am Ringgelenk aufsetzt</text>
<text x="820.0" y="1084.0" font-size="12" fill="#27313d" text-anchor="start"></text>
<text x="820.0" y="1109.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="700">Offen / zu prüfen</text>
<text x="820.0" y="1128.0" font-size="12" fill="#27313d" text-anchor="start">• Gewicht Abdeckung (ca. 20 kg) > Ring + Federmoment: sonst gleitet das Rohr, bevor die Wanne offen ist</text>
<text x="820.0" y="1147.0" font-size="12" fill="#27313d" text-anchor="start">• Abdeckung Ø so klein wie möglich: Abstand zum aufgeklappten Domdeckel; Ring muss jeden Kragen treffen</text>
<text x="820.0" y="1166.0" font-size="12" fill="#27313d" text-anchor="start">• Kabel Überfüllsicherung: Abdeckung bewegt sich bis 2,3 m gegenüber dem Rohr (Spiralkabel/Federzug)</text>
<text x="820.0" y="1185.0" font-size="12" fill="#27313d" text-anchor="start">• Führung: großes Spiel, PE/PTFE-Gleitflächen, Fasen – Acronal klebt; in Park an der Spülwanne mitspülen</text>
<text x="820.0" y="1204.0" font-size="12" fill="#27313d" text-anchor="start">• Gewicht vorn am Auslass → Moment J3 / Lastfall IMO; Werkstoff 1.4571, Gelenke mit PTFE-Gleitlagern</text>
