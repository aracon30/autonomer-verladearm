<text x="550.4" y="799.0" font-size="11" fill="#1d4ed8" text-anchor="start">Grenzschalter A/B + Kabelnut</text>
<text x="820.0" y="736.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="700">Funktion</text>
<text x="820.0" y="755.0" font-size="12" fill="#27313d" text-anchor="start">① Park/Anfahren: Die Abdeckung hängt auf dem Anschlagbund. Die Schenkelfeder hält die Wanne geschlossen,</text>
<text x="820.0" y="774.0" font-size="12" fill="#27313d" text-anchor="start">   25 mm unter dem Rohrende. Nachtropfen landet in der Wanne.</text>
<text x="820.0" y="793.0" font-size="12" fill="#27313d" text-anchor="start">② Die Abdeckung setzt auf dem Dom auf, das Rohr fährt weiter. Das Rohrende drückt auf den Wannenboden</text>
<text x="820.0" y="812.0" font-size="12" fill="#27313d" text-anchor="start">   neben dem Gelenk – die Wanne schwenkt nach unten weg. Kein Hebel, kein Ring, jede Domgröße.</text>
<text x="820.0" y="831.0" font-size="12" fill="#27313d" text-anchor="start">③ Bei ca. 80° liegt die Wannenspitze mit einer PTFE-Kufe leicht am Rohr an; das Rohr gleitet vorbei</text>
<text x="820.0" y="850.0" font-size="12" fill="#27313d" text-anchor="start">   und wird dabei abgestreift. Die Abdeckung bleibt auf dem Dom (Überfüllsicherung in fester Tiefe).</text>
<text x="820.0" y="869.0" font-size="12" fill="#27313d" text-anchor="start">④ Herausfahren: Ist das Rohrende an der Kufe vorbei, drückt die Feder die Wanne nach. Sie folgt dem Rohrende</text>
<text x="820.0" y="888.0" font-size="12" fill="#27313d" text-anchor="start">   und liegt in Park wieder geschlossen darunter. Erst dann nimmt der Anschlagbund die Abdeckung mit.</text>
<text x="820.0" y="907.0" font-size="12" fill="#27313d" text-anchor="start"></text>
<text x="820.0" y="932.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="700">Teile: 1 Wanne, 1 Gelenk, 1 Schenkelfeder, 1 PTFE-Gleitkufe</text>
<text x="820.0" y="951.0" font-size="12" fill="#27313d" text-anchor="start">• Gelenk 110 mm neben der Rohrachse, 90 mm unter der Abdeckung; Wanne 180 × 170 mm, Rand 15 mm; offen ca. 80°</text>
<text x="820.0" y="970.0" font-size="12" fill="#27313d" text-anchor="start">• offene Wanne ca. 0,26 m unter dem Domrand: über dem Spiegel 95 % (0,34 m); Maximalhöhe 0,28 m nur im Fehlerfall</text>
<text x="820.0" y="989.0" font-size="12" fill="#27313d" text-anchor="start">• Federmoment klein (Kufe ca. 10–20 N am Rohr), aber sicher > Gewicht Wanne mit Tropfen (Wanne zu in Park)</text>
<text x="820.0" y="1008.0" font-size="12" fill="#27313d" text-anchor="start">• Rohrende mit Fase/Rundung; drückt anfangs 50 mm neben dem Gelenk, kein Totpunkt (Wanne waagerecht)</text>
<text x="820.0" y="1027.0" font-size="12" fill="#27313d" text-anchor="start">• Grenzschalter A/B und Kabelnut auf der Seite 90° zur Wanne, nicht im Bereich von Wanne und Kufe</text>
<text x="820.0" y="1046.0" font-size="12" fill="#27313d" text-anchor="start">• alles unter der Abdeckung innerhalb r ≤ 205 mm: passt in die kleinste Domöffnung Ø 450</text>
<text x="820.0" y="1065.0" font-size="12" fill="#27313d" text-anchor="start"></text>
<text x="820.0" y="1090.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="700">Offen / zu prüfen</text>
<text x="820.0" y="1109.0" font-size="12" fill="#27313d" text-anchor="start">• Schleifen der Kufe mit Acronal (Anhaftung, Verschleiß) – im Test prüfen; Alternative: kleine PE-Rolle</text>
<text x="820.0" y="1128.0" font-size="12" fill="#27313d" text-anchor="start">• Seitenkraft der Kufe auf das Rohr: nimmt die Führung der Abdeckung auf</text>
<text x="820.0" y="1147.0" font-size="12" fill="#27313d" text-anchor="start">• Abdeckung Ø so klein wie möglich (aufgeklappter Domdeckel); Kabel Überfüllsicherung (Weg bis 2,3 m)</text>
<text x="820.0" y="1166.0" font-size="12" fill="#27313d" text-anchor="start">• Gewicht vorn am Auslass → Moment J3 / Lastfall IMO; Werkstoff 1.4571, Feder Edelstahl, Spülen in Park</text>
</svg>