[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verladearm-vision"
version = "0.1.0"
description = "Erkennung der Domöffnung und SPS-Schnittstelle für den autonomen Verladearm"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "asyncua>=1.1",
]

[project.optional-dependencies]
viz = ["open3d>=0.18"]
sick = ["visionary-python-base @ git+https://github.com/SICKAG/sick_visionary_python_base"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["vision/src"]

[tool.setuptools.package-data]
verladearm_vision = ["viewer/*.html"]

[tool.pytest.ini_options]
testpaths = ["vision/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["verladearm_vision"]
