# Anlagenparameter Verladearm – HETA Prototyp
# Maße aus der Konstruktionszeichnung, Antriebe aus hardware/antriebe.md.
# Servowerte (zero, direction, park) sind PLATZHALTER bis zur Einrichtung am Arm
# (python -m verladearm_vision.einrichtung --name heta_prototyp --from-plc).
#
# Anlage:            HETA Prototyp
# Inbetriebnahme:    offen
# Freigabe:          offen

extends: beispiel.yaml

arm:
  base_height: 5.5        # vor Ort messen
  inner_length: 2.4       # Zeichnung: 2548 − 148
  incline_deg: 3          # nur innerer Ausleger; Winkel danach 87° -> Fallrohr/J2 senkrecht
  drop: 0.43              # aus 961 − 404 − 2400·tan 3° (prüfen)
  offset_right: 0.563
  outer_length: 2.7
  offset_left: 0.447
  outlet_length: 1.408
  joints:
    # J1/J2: Zahnkranz mit Öffnung, verzahnt ca. 296° -> Bereich mit Abstand zur Lücke
    q1: {min: -120, max: 120, park: 70, zero: 0, direction: 1}
    q2: {min: -140, max: 140, park: -135, zero: 0, direction: 1}
    # J3: Schwenkantrieb ±45° zur Waagerechten (Nullstellung: äußerer Ausleger waagerecht)
    q3: {min: -45, max: 45, park: 10, zero: 0, direction: 1}
  obstacles: []           # Stützen, Bühne, Geländer vor Ort erfassen
  clearance: 0.15

# Referenz für das Nachmessen (Job 2) und die Kalibrierung: vorhandener Flansch am Auslassrohr
# (DN 100, Ø 220 mm), von oben sichtbar. Nur für diesen Arm; andere Arme: Markierungsscheibe.
outlet:
  marker_radius: 0.11     # halber Flanschdurchmesser [m]
  marker_offset: 0.823    # Flanschoberkante bis unterster Punkt Auslass [m]
  pipe_radius: 0.057     # Auslassrohr Ø 114,3 mm (Rohrachse über dem Flansch als zweites Merkmal)

# Antriebe je Achse, Werte am Gelenk (Details und Herleitung: hardware/antriebe.md)
drives:
  q1:
    motor: SEW CM3C71S (Servo, mit Bremse, Multiturn-Absolutgeber – angefragt)
    gear: P5KG31 i=4 × Ritzel z48 / Zahnkranz z127 (Modul 2) – Konstruktion
    motor_speed: 2000
    ratio: 10.58          # 4 × 127/48
    speed_limit: 6        # °/s am Gelenk (Anwendung)
    accel_time: 4         # s, großer Arm-Trägheit wegen sanft
    backlash: 0.1         # ° Annahme (Planetengetriebe 5′/2,65 + Zahnflankenspiel m 2)
    torque: 63            # 6,5 Nm × 10,58 × 0,92
    torque_peak: 190      # 19,5 Nm × 10,58 × 0,92
    brake: true
    encoder: Multiturn absolut (angefragt)
  q2:
    motor: SEW CM3C71S (Servo, mit Bremse, Multiturn-Absolutgeber – angefragt)
    gear: P5KG31 i=4 × Ritzel z48 / Zahnkranz z127 (Modul 2) – Konstruktion
    motor_speed: 2000
    ratio: 10.58
    speed_limit: 6
    accel_time: 2
    backlash: 0.1
    torque: 63
    torque_peak: 190
    brake: true
    encoder: Multiturn absolut (angefragt)
  q3:
    motor: SEW RF47 DRN80M4/BE05/TF (Asynchron, Bremse 1,8 Nm, Geber angefragt)
    gear: RF47 i=42,87 × IMO WD-E 0223/3 i=34 (Schnecke)
    motor_speed: 1440
    ratio: 1457.6         # 42,87 × 34
    speed_limit: 6        # IMO: max. 1 1/min am Abtrieb
    accel_time: 1.5
    backlash: 0.1         # ° Annahme, Verzahnungsspiel bei IMO offen
    gravity_preload: true # Gewicht drückt das Spiel immer auf eine Seite
    torque: 3300          # 215 Nm × 34 × ~0,45
    torque_peak: 4500
    brake: true
    encoder: Multiturn absolut (angefragt)

commissioning:
  workspace_min: [2.6, -0.6, -2.3]
  workspace_max: [3.6, 0.6, -0.5]
  step: 0.2
