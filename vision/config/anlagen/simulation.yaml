# Simulation ohne Hardware: HETA-Prototyp mit seinen Antrieben (Geschwindigkeiten, Rampen,
# Getriebespiel), simulierter Sensor und SPS-Simulator auf demselben Rechner.
# Stand 03.11.2026: nur Lkw-Tankwagen, ein bis drei Kammern mit offenem Mannloch, Auslass bis
# 20 cm über den Tankboden, Nachziehen mit zwei Grenzschaltern. Start: tools/simulation.sh
extends: heta_prototyp.yaml

source:
  type: sim
  joint_error_deg: [0.3, -0.25, 0.2]   # Durchbiegung/Modellfehler, wird in Job 2 nachgemessen
  vehicles: [lkw]                      # erst einmal nur Lkw (Kesselwagen: [lkw, kesselwagen])
  domes: [offen]                       # Mannloch ganz offen, Deckel aufgeklappt
  openings: [1, 2, 3]                  # Kammern je Fahrzeug (je ein Dom), zufällig
  dome_pitch: 2.5                      # m Abstand der Dome = Kammerlänge (ca. 9,5 m³ je Kammer)

detection:                             # Arbeitsraum für bis zu 3 Dome hintereinander
  roi_min: [-2.0, -3.3, 0.5]
  roi_max: [2.0, 3.3, 8.0]

vehicle:
  front: [0.0, 1.0]                    # Richtung zur Fahrzeugfront (Armbasis): Dom 1 = vorderster
  lane_center: [3.0, 0.0]              # Mitte der eigenen Spur (Armbasis, m)
  lane_width: 3.5                      # Dome nur in der eigenen Spur suchen

plc:
  url: opc.tcp://127.0.0.1:4840/       # tools/plc_simulator.py

# Befüllung mit Nachziehen (docs/fuellstand_ueberfuellsicherung.md, Stand 09.11.2026). Menge, Pumpe
# und Füllende steuert die Leitstelle; die SPS öffnet die Klappe, zieht über einen Grenzschalter
# nach und meldet bei Störung oder Maximalhöhe „Befüllung stoppen“ (erst Pumpe aus, dann Klappe zu).
filling:
  flow: 22                # m³/h Pumpe der Leitstelle (BASF: 20–25 m³/h)
  tank_diameter: 2.2      # m Lkw-Tank (liegender Zylinder)
  chamber_length: 2.5     # m je Kammer (wie source.dome_pitch); verbundene Kammern: × Domzahl
  depth_below_rim: 2.32   # m Tankboden unter Domrand (Tank + Domkragen 0,12 m)
  start_level: 0.03       # m Restmenge über dem Boden
  fill_ratio: 0.95        # Menge der Leitstelle: 95 % des Kammervolumens (der SPS unbekannt)
  sensor_height: 0.12     # m Grenzschalter über dem Auslassende (10–15 cm)
  lift_step: 0.05         # m Hub je Schaltvorgang -> Auslass ca. 7–12 cm unter dem Spiegel
  pump_rundown: 3         # s Auslaufzeit der Pumpe, erst danach Klappe zu
  max_below_rim: 0.28     # m Maximalhöhe Spiegel (Ebene 2) unter Domrand (Füllende 95 % ≈ 0,34 m)
  overfill_below_rim: 0.22  # m Schaltpunkt Überfüllsicherung (Ebene 3) unter Domrand
  speedup: 40             # Simulation: Befüllung zusätzlich zum Zeitraffer schneller zeigen

products:
  # Eintauchtiefe unter Domrand je ProductId: Auslass ca. 20 cm über dem Tankboden
  # (2,32 m − 0,2 m). Der Referenzflansch (Ø 220) passt durch das offene Mannloch.
  default: {insertion_depth: 2.1}
  1: {name: Dispersion A, insertion_depth: 2.1}
  2: {name: Dispersion B, insertion_depth: 2.1}
